<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Hangman Riddle</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            max-width: 520px;
            width: 100%;
            padding: 24px;
            background: #1e1e1e;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h1 {
            color: #7ec8e3;
            font-size: 1.5rem;
            margin: 0 0 4px;
        }
        .game-desc {
            font-size: 0.85rem;
            color: #aaa;
            margin: 0 0 14px;
            line-height: 1.5;
        }
        .holiday-banner {
            display: none;
            background: linear-gradient(90deg, #7ec8e3, #03dac6);
            color: #121212;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 14px;
            font-size: 0.95rem;
        }
        .riddle-text {
            font-size: 1.8rem;
            font-weight: bold;
            margin: 10px 0 16px;
            min-height: 3em;
        }

        /* ---- Hangman-as-scorekeeper ---- */
        .hangman-svg {
            margin: 4px auto 6px;
            display: block;
        }
        .hangman-svg line, .hangman-svg circle {
            stroke: #e0e0e0;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
        }
        .wrong-count {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 12px;
        }
        .word-display {
            font-size: 1.7rem;
            letter-spacing: 8px;
            font-family: 'Courier New', monospace;
            margin: 8px 0 16px;
            min-height: 2em;
            word-break: break-word;
        }
        .keyboard {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-bottom: 14px;
        }
        .key-btn {
            background: #2a2a2a;
            color: #e0e0e0;
            border: 1px solid #3a3a3a;
            width: 34px;
            height: 34px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .key-btn:hover:not(:disabled) {
            background: #7ec8e3;
            color: #121212;
        }
        .key-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .key-btn.correct-key { background: #1b3a2b; color: #4ade80; border-color: #1b3a2b; }
        .key-btn.wrong-key { background: #3a1b1b; color: #f87171; border-color: #3a1b1b; }
        .status-msg {
            font-size: 1.05rem;
            font-weight: bold;
            min-height: 1.4em;
            margin: 6px 0;
        }
        .status-msg.win { color: #4ade80; }
        .status-msg.lose { color: #f87171; }
        .give-up-btn {
            background: transparent;
            color: #aaa;
            border: 1px solid #3a3a3a;
            padding: 7px 16px;
            font-size: 0.85rem;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 4px;
        }
        .give-up-btn:hover { border-color: #7ec8e3; color: #7ec8e3; }
        .give-up-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    </style>
</head>

        // ---- Holiday-special riddles (override the day's pick on that date) ----
        function pad(n) { return n < 10 ? "0" + n : "" + n; }
        function dateKey(d) { return pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }

        function nthWeekdayOfMonth(year, month, weekday, n) {
            const d = new Date(year, month, 1);
            let count = 0;
            while (true) {
                if (d.getDay() === weekday) {
                    count++;
                    if (count === n) return new Date(d);
                }
                d.setDate(d.getDate() + 1);
            }
        }

        function getEasterDate(year) {
            const a = year % 19;
            const b = Math.floor(year / 100);
            const c = year % 100;
            const d = Math.floor(b / 4);
            const e = b % 4;
            const f = Math.floor((b + 8) / 25);
            const g = Math.floor((b - f + 1) / 3);
            const h = (19 * a + b - d - g + 15) % 30;
            const i = Math.floor(c / 4);
            const k = c % 4;
            const l = (32 + 2 * e + 2 * i - h - k) % 7;
            const m = Math.floor((a + 11 * h + 22 * l) / 451);
            const month = Math.floor((h + l - 7 * m + 114) / 31);
            const day = ((h + l - 7 * m + 114) % 31) + 1;
            return new Date(year, month - 1, day);
        }

        function getHolidaySpecials(year) {
            const easter = getEasterDate(year);
            const mothersDay = nthWeekdayOfMonth(year, 4, 0, 2);

            const thanksgiving = nthWeekdayOfMonth(year, 10, 4, 4);

            specials["10-31"] = { name: "Halloween", emoji: "🎃", q: "What glows orange, has a carved face, and sits on porches every October 31st?", a: "A jack-o'-lantern!", word: "PUMPKIN" };

        }

        // =========================================================
        // Game state
        // =========================================================
        const hmParts = ["hm-head", "hm-torso", "hm-arm-l", "hm-arm-r", "hm-leg-l", "hm-leg-r"];
        let currentRiddle = null;
        let guessedLetters = [];
        let wrongCount = 0;
        let gameOver = false;

        function loadDailyRiddle() {
            const now = new Date();
            const key = dateKey(now);
            const holidaySpecials = getHolidaySpecials(now.getFullYear());
            const banner = document.getElementById("holidayBanner");

            if (holidaySpecials[key]) {
                const special = holidaySpecials[key];
                banner.style.display = "block";
                banner.textContent = special.emoji + " " + special.name + " Special Riddle! " + special.emoji;
                currentRiddle = special;
            } else {
                banner.style.display = "none";
                // Changes every hour (based on absolute time, not local clock)
                const hoursSinceEpoch = Math.floor(now.getTime() / (1000 * 60 * 60));
                const index = hoursSinceEpoch % riddles.length;
                currentRiddle = riddles[index];
            }

            document.getElementById("riddle").innerText = currentRiddle.q;
            startRound();
        }

        function startRound() {
            guessedLetters = [];
            wrongCount = 0;
            gameOver = false;

            hmParts.forEach(id => document.getElementById(id).style.display = "none");
            document.getElementById("wrongCount").textContent = "Wrong guesses: 0 / 6";
            document.getElementById("statusMsg").textContent = "";
            document.getElementById("statusMsg").className = "status-msg";
            document.getElementById("giveUpBtn").disabled = false;

            renderWordDisplay();
            renderKeyboard();
        }

        function renderWordDisplay() {
            const display = currentRiddle.word.split("").map(ch => {
                if (ch === " ") return " ";
                return guessedLetters.includes(ch) ? ch : "_";
            }).join(" ");
            document.getElementById("wordDisplay").textContent = display;
        }

        function renderKeyboard() {
            const kb = document.getElementById("keyboard");
            kb.innerHTML = "";
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(letter => {
                const btn = document.createElement("button");
                btn.className = "key-btn";
                btn.textContent = letter;
                btn.onclick = () => guessLetter(letter);
                kb.appendChild(btn);
            });
        }

        function guessLetter(letter) {
            if (gameOver || guessedLetters.includes(letter)) return;
            guessedLetters.push(letter);

            const btn = Array.from(document.getElementById("keyboard").children)
                .find(b => b.textContent === letter);

            if (currentRiddle.word.includes(letter)) {
                btn.classList.add("correct-key");
            } else {
                btn.classList.add("wrong-key");
                wrongCount++;
                document.getElementById(hmParts[wrongCount - 1]).style.display = "block";
                document.getElementById("wrongCount").textContent = "Wrong guesses: " + wrongCount + " / 6";
            }
            btn.disabled = true;

            renderWordDisplay();
            checkGameEnd();
        }

        function checkGameEnd() {
            const wordLetters = currentRiddle.word.replace(/ /g, "").split("");
            const won = wordLetters.every(ch => guessedLetters.includes(ch));
            const lost = wrongCount >= 6;

            if (won || lost) {
                gameOver = true;
                document.querySelectorAll("#keyboard .key-btn").forEach(b => b.disabled = true);
                document.getElementById("giveUpBtn").disabled = true;
                const statusEl = document.getElementById("statusMsg");
                if (won) {
                    statusEl.textContent = "🎉 Correct! The answer is: " + currentRiddle.a;
                    statusEl.className = "status-msg win";
                } else {
                    statusEl.textContent = "💀 Out of guesses! The answer was: " + currentRiddle.a;
                    statusEl.className = "status-msg lose";
                    hmParts.forEach(id => document.getElementById(id).style.display = "block");
                }
            }
        }

        function giveUp() {
            if (gameOver) return;
            gameOver = true;
            wrongCount = 6;
            hmParts.forEach(id => document.getElementById(id).style.display = "block");
            document.getElementById("wrongCount").textContent = "Wrong guesses: 6 / 6";
            document.querySelectorAll("#keyboard .key-btn").forEach(b => b.disabled = true);
            document.getElementById("giveUpBtn").disabled = true;
            document.getElementById("wordDisplay").textContent = currentRiddle.word.split("").join(" ");
            const statusEl = document.getElementById("statusMsg");
            statusEl.textContent = "The answer was: " + currentRiddle.a;
            statusEl.className = "status-msg lose";
        }

        // Run on page load
        loadDailyRiddle();
    </script>

</body>
</html>
