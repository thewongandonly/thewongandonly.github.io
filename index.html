<!doctype html>
<html>
  <head>
    <title>David Wong</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.44/dist/vue.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue3-sfc-loader"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #212629;
      }
    </style>
    <link
      rel="icon"
      type="image/png"
      href="https://thewongandonly.com/favicon.ico"
    />
  </head>

  <body>
    <div id="app"></div>

    <script>
      const options = {
        moduleCache: {
          vue: Vue,
        },
        getFile(url) {
          return fetch(url).then((resp) =>
            resp.ok ? resp.text() : Promise.reject(resp),
          );
        },
        addStyle(styleStr) {
          const style = document.createElement("style");
          style.textContent = styleStr;
          const ref = document.head.getElementsByTagName("style")[0] || null;
          document.head.insertBefore(style, ref);
        },
        log(type, ...args) {
          console.log(type, ...args);
        },
      };

      const { loadModule, version } = window["vue3-sfc-loader"];
      const { createApp, ref, computed } = Vue;

      const app = createApp({
        components: {
          Sunset: Vue.defineAsyncComponent(() =>
            loadModule("./sunset.vue", options),
          ),
          Sidebar: Vue.defineAsyncComponent(() =>
            loadModule("./Sidebar.vue", options),
          ),
          FullBackground: Vue.defineAsyncComponent(() =>
            loadModule("./myBackground.vue", options),
          ),
          MiniPod: Vue.defineAsyncComponent(() =>
            loadModule("./MiniPod.vue", options),
          ),
          VueTerminal: Vue.defineAsyncComponent(() =>
            loadModule("./VueTerminal.vue", options),
          ),
          Dance: Vue.defineAsyncComponent(() =>
            loadModule("./Dance.vue", options),
          ),
          SlideShower: Vue.defineAsyncComponent(() =>
            loadModule("./SlideShower.vue", options),
          ),
        },
        setup() {
          const currentIndex = ref(0);
          const runningIndex = ref(-1);

          const showppod = ref(false);
          const myvid = ref("sunset.mp4");
          const showchat = computed(() => currentIndex.value !== 1);
          const setVid = (newVid) => {
            myvid.value = newVid;
          };
          const setGone = () => {
            showppod.value = true;
          };
          const setRunning = (n) => {
            runningIndex.value = n;
            if ((n ?? -1) < 0) return;
            currentIndex.value = n;
            let vid;
            switch (n) {
              case 1:
                vid = "sea.mp4";
                break;
              case 2:
                vid = "darkcode.mp4";
                break;
              default:
                vid = "sunset.mp4";
                break;
            }
            setVid(vid);
          };
          // Expose variables and functions to the template
          return {
            myvid,
            showchat,
            setVid,
            showppod,
            setGone,
            currentIndex,
            setRunning,
            runningIndex,
          };
        },
        template: `<FullBackground :vid="myvid" /> 
        <Sunset @is-gone="setGone" :running="runningIndex" />  
        <MiniPod v-if="showppod" :index=currentIndex @started-song="setRunning"  />  
        <SlideShower v-if="runningIndex === 3" />
        <VueTerminal v-if="runningIndex === 2" />
        <Dance v-if="runningIndex === 1" />
        <Sidebar v-if="showchat" />
        `,
      });

      app.mount("#app");
    </script>
  </body>
</html>
