<!DOCTYPE html>
<html>
  <head>
    <title>David Wong</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue3-sfc-loader"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #212629;
      }
    </style>
    <link
      rel="icon"
      type="image/png"
      href="https://thewongandonly.com/favicon.ico"
    />
  </head>

  <body>
    <div id="app"></div>

    <script>
      const options = {
        moduleCache: {
          vue: Vue,
        },
        getFile(url) {
          return fetch(url).then((resp) =>
            resp.ok ? resp.text() : Promise.reject(resp)
          );
        },
        addStyle(styleStr) {
          const style = document.createElement("style");
          style.textContent = styleStr;
          const ref = document.head.getElementsByTagName("style")[0] || null;
          document.head.insertBefore(style, ref);
        },
        log(type, ...args) {
          console.log(type, ...args);
        },
      };

      const { loadModule, version } = window["vue3-sfc-loader"];
      const { createApp, ref, computed } = Vue;

      const app = createApp({
        components: {
          "sunset": Vue.defineAsyncComponent(() =>
            loadModule("./sunset.vue", options)
          ),
          sidebar: Vue.defineAsyncComponent(() =>
            loadModule("./Sidebar.vue", options)
          ),
          "my-background": Vue.defineAsyncComponent(() =>
            loadModule("./myBackground.vue", options)
          )
        },
        setup() {

          const myvid = ref("sunset.mp4");
          const showchat = computed(() => myvid.value === "sunset.mp4");
          const setVid = (newVid) => {
            myvid.value = newVid;
          };

          // Expose variables and functions to the template
          return {
            myvid,
            showchat,
            setVid,
          };
        },
        template: `<my-background :vid="myvid" /><sunset /> <sidebar v-if="showchat" />`,
      });

      app.mount("#app");
    </script>
  </body>
</html>
