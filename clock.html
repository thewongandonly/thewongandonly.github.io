<!doctype html>
<html>
  <head>
    <style>
      body {
        background-color: #0e1117;
        color: #b0e0e6;
        font-family: "Courier New", Courier, monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }

      /* Wrapper to style the clock like a flip-clock card module */
      .flip-clock-wrapper {
        background: linear-gradient(180deg, #242933 0%, #15181e 100%);
        border: 4px solid #3a4252;
        border-radius: 24px;
        padding: 50px 60px;
        box-shadow:
          0 15px 45px rgba(0, 0, 0, 0.8),
          inset 0 1px 2px rgba(255, 255, 255, 0.15);
        position: relative;
        text-align: center;
        min-width: 45%;
        box-sizing: border-box;
      }

      /* Horizontal split line mimicking a physical flip card seam */
      .flip-clock-wrapper::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        height: 3px;
        background: rgba(0, 0, 0, 0.65);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.1);
        pointer-events: none;
      }

      .flip-H {
        font-size: 6em;
        margin-bottom: 20px;
      }

      .clock {
        font-size: 10em;
        font-weight: bold;
        letter-spacing: 8px;
        text-shadow: 0 0 25px rgba(176, 224, 230, 0.4);
      }

      .centered {
        text-align: center;
        display: block;
      }

      .centered img {
        vertical-align: middle;
        width: 140px;
        height: 140px;
      }
    </style>

    <script>
      function startTime() {
        var today = new Date();
        var h = today.getHours();
        var m = today.getMinutes();
        var s = today.getSeconds();
        m = checkTime(m);
        s = checkTime(s);

        document.getElementById("txt").innerHTML = convertText(h + ":" + m);
        document.getElementById("txt2").innerHTML = h + ":" + m;

        var t = setTimeout(startTime, 2000);
      }

      function checkTime(i) {
        if (i < 10) {
          i = "0" + i;
        } // add zero in front of numbers < 10
        return i;
      }

      function reverse(s) {
        var o = "";
        for (var i = s.length - 1; i >= 0; i--) {
          if (s[i] == ":") {
            o += s[i];
          } else {
            o = o + '<img src="' + s[i] + '.png" width="140" height="140">';
          }
        }
        return o;
      }

      function convertText(srcText) {
        return reverse(srcText);
      }
    </script>
  </head>

  <body onload="startTime()">
    <div class="flip-clock-wrapper">
      <div id="txt" class="centered flip-H"></div>
      <div id="txt2" class="centered clock"></div>
    </div>
  </body>
</html>
